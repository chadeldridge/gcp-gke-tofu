apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptest
  namespace: uptest
  annotations:
    # TEMPORARY: remove once scripts/build.sh has run via CI and pinned
    # kustomization.yaml to a real digest (see .github/workflows/deploy-dev.yml)
    # -- at that point the image reference itself satisfies both checks.
    checkov.io/skip1: CKV_K8S_14=newTag is a placeholder overwritten with a digest-pinned reference by scripts/build.sh before every deploy
    checkov.io/skip2: CKV_K8S_43=same as above -- pinned by digest once scripts/build.sh has run via CI
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uptest
  template:
    metadata:
      labels:
        app: uptest
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uptest
          # Image is pinned by the images field in kustomization.yaml.
          image: uptest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_NAME
              value: app-dev
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
