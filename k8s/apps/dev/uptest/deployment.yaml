apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptest
  namespace: uptest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uptest
  template:
    metadata:
      labels:
        app: uptest
    spec:
      containers:
        - name: uptest
          # Image is pinned by the images field in kustomization.yaml.
          image: uptest
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CLUSTER_NAME
              value: dev1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
