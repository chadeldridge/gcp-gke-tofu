---
# Applies everything under k8s/infrastructure/ to the cluster.
# Flux reconciles this on every interval, so infrastructure changes
# are picked up automatically once pushed to the repo.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infrastructure
  prune: true
  wait: true
