apiVersion: v1
kind: Service
metadata:
  name: uptest
  namespace: uptest
  annotations:
    cloud.google.com/backend-config: '{"default": "uptest"}'
spec:
  selector:
    app: uptest
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      # Fixed NodePort so the nginx LB can reference a stable port.
      # Corresponds to nginx_http_nodeport in ansible/inventory/group_vars/loadbalancer.yaml.
      nodePort: 30080
